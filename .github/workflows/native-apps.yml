name: Native apps
on:
  push:
    branches: [main, native-app-v0.5.0]
    paths: ['mobile/**', '*.js', '*.json', '*.css', 'index.html', 'assets/**', 'tests/**', '.github/workflows/native-apps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: mobile
      - run: pnpm build && pnpm exec cap sync android && pnpm test
        working-directory: mobile
      - run: bash gradlew --no-daemon assembleRelease
        working-directory: mobile/android
      - name: Prepare unsigned APK for local private signing
        run: |
          mkdir -p native-artifact
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -P 16 -f 4 mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk native-artifact/Vale-Study-Android-unsigned.apk
          cp "$tools/lib/apksigner.jar" native-artifact/apksigner.jar
          cp "$tools/NOTICE.txt" native-artifact/ANDROID-TOOLS-NOTICE.txt
          sha256sum native-artifact/* > native-artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-for-signing
          path: native-artifact/
          retention-days: 7
  ios:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: mobile
      - run: pnpm build && pnpm exec cap sync ios && pnpm test
        working-directory: mobile
      - name: Compile iPad app without signing credentials
        run: xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Vale-Study-unsigned.xcarchive" CODE_SIGNING_ALLOWED=NO archive
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-archive-NOT-INSTALLABLE
          path: ${{ runner.temp }}/Vale-Study-unsigned.xcarchive
          retention-days: 7
